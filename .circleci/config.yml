version: 2.1
jobs:
  lint-dockerfile:
    machine:
      image: ubuntu-2204:current  # Gunakan mesin virtual penuh
    steps:
      - checkout
      - run:
          name: Install Docker
          command: |
            sudo apt update
            sudo apt install -y ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt update
            sudo apt install -y docker-ce docker-ce-cli containerd.io
      - run:
          name: Lint Dockerfile
          command: docker run --rm -i hadolint/hadolint hadolint Dockerfile





  test-app:
    docker:
      - image: golang:1.20
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    docker:
      - image: docker:latest
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to Docker Hub
          command: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build Docker Image
          command: docker build -t $DOCKERHUB_USERNAME/karsajobs:latest .
      - run:
          name: Push Docker Image
          command: docker push $DOCKERHUB_USERNAME/karsajobs:latest

workflows:
  version: 2
  build_and_test:
    jobs:
      - lint-dockerfile
      - test-app
      - build-app-karsajobs:
          requires:
            - lint-dockerfile
            - test-app
